<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Mobil ekranlara tam sığması için viewport ayarı -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Yapboz Çözücü</title>
    <link rel="stylesheet" href="style.css">
    <!-- OpenCV.js Kütüphanesi -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <div class="app-wrapper">
        <h1>🧩 1000'lik Yapboz Asistanı</h1>
        
        <!-- Canlı Kamera Görünümü -->
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <!-- Kullanıcının parçayı ortalamasına yardım edecek hedef çizgisi -->
            <div class="camera-overlay"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        
        <!-- Mobil Buton Grubu (Ekranın altında rahat basılsın diye) -->
        <div class="button-group">
            <button id="capture-ref-btn">📸 1. Kutu Resmini Çek</button>
            <button id="capture-piece-btn" disabled>🔍 2. Parçayı Tara</button>
        </div>

        <!-- Durum Bildirim Alanı -->
        <div id="result">
            <p id="status">Kamera açılıyor, lütfen bekleyin...</p>
        </div>

        <!-- Çekilen Kutu Resminin Önizlemesi -->
        <div id="preview-container" style="display:none;">
            <p>Hafızadaki Kutu Resmi:</p>
            <canvas id="ref-canvas"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
