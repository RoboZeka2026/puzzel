<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Yapboz Çözücü</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" type="text/javascript"></script>
</head>
<body>
    <div class="app-wrapper">
        <h1>🧩 1000'lik Yapboz Asistanı</h1>
        
        <!-- Canlı Kamera Görünümü -->
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="camera-overlay"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        
        <!-- Buton Grupları -->
        <div class="button-group">
            <button id="capture-ref-btn">📸 1. Kutu Resmini Çek</button>
            <button id="capture-piece-btn" disabled>🔍 2. Parçayı Tara</button>
        </div>

        <!-- Durum Bildirim Alanı -->
        <div id="result">
            <p id="status">Zeka motoru ve kamera yükleniyor, lütfen bekleyin...</p>
        </div>

        <!-- YENİ: Otomatik Zoom / Odaklanma Alanı -->
        <div id="zoom-container" style="display:none;">
            <p>🔍 YAKINLAŞTIRILMIŞ HEDEF BÖLGE:</p>
            <canvas id="zoom-canvas"></canvas>
        </div>

        <!-- Çekilen Kutu Resminin Tam Önizlemesi -->
        <div id="preview-container" style="display:none;">
            <p>Kutu Resmi Genel Görünüm:</p>
            <canvas id="ref-canvas"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
