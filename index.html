<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000'lik Yapboz Çözücü</title>
    <link rel="stylesheet" href="style.css">
    <!-- OpenCV.js Kütüphanesini Yüklüyoruz -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h1>1000'lik Yapboz Çözücü</h1>
    
    <div class="container">
        <!-- 1. Adım: Referans Resim Yükleme -->
        <div class="upload-section">
            <label for="ref-image">Yapbozun Bitmiş Halini Yükleyin:</label>
            <input type="file" id="ref-image" accept="image/*">
            <img id="preview-ref" style="display:none; max-width:100%; margin-top:10px; border-radius:5px;">
        </div>

        <hr>

        <!-- 2. Adım: Kamera Alanı -->
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <button id="capture-btn">Parçayı Tara</button>
    </div>

    <div id="result">
        <h3>Analiz Sonucu:</h3>
        <p id="status">Lütfen önce bitmiş yapboz resmini yükleyin.</p>
    </div>

    <script src="app.js"></script>
</body>
